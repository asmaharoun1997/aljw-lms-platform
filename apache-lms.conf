<VirtualHost vm-metatron.local:80>
    ServerName vm-metatron.local

    ProxyRequests Off
    ProxyPreserveHost On

    # Proxy / → /lms/ sur Tomcat
    ProxyPass        /  http://127.0.0.1:8080/lms/ retry=0 timeout=60
    ProxyPassReverse /  http://127.0.0.1:8080/lms/

    # Nécessaire avec ProxyPreserveHost On :
    # Tomcat génère des redirects avec le Host du proxy (vm-metatron.local)
    # que ProxyPassReverse ne réécrit pas (il cherche 127.0.0.1:8080).
    # Cette ligne attrape ces redirects.
    ProxyPassReverse /  http://vm-metatron.local/lms/

    # Optionnel : headers pour que l'appli sache qu'elle est derrière un proxy
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port  "80"
</VirtualHost>
