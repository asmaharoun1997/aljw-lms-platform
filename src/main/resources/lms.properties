# ══════════════════════════════════════════════════════════════
#  LMS Platform — Configuration
#  Ce fichier doit être dans le classpath (WEB-INF/classes/)
#  ou dans $CATALINA_BASE/lib/
# ══════════════════════════════════════════════════════════════

# ── Répertoire de données (bundles, backups, BDD H2) ──
# Chemin absolu recommandé en production
# Par défaut : sous-dossier "data" à côté du répertoire Tomcat
lms.data.dir=/opt/tomcat/data/lms

# ── Base de données H2 ──
# URL JDBC (construite automatiquement à partir de data.dir si vide)
# lms.db.url=jdbc:h2:/opt/tomcat/data/lms/db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
lms.db.user=sa
lms.db.password=

# ── Compte admin par défaut (créé au premier lancement) ──
lms.admin.username=admin
# lms.admin.password : NE PAS renseigner ici. A passer au deploiement : -Dlms.admin.password=...

# ── Session HTTP ──
lms.session.timeout.minutes=120

# ── Upload ──
# Taille max des bundles ZIP (en octets)
lms.upload.max.size=200000000

# ── Plateforme (valeurs par défaut, modifiables ensuite via l'admin) ──
lms.platform.name=LMS Platform
lms.platform.color=#4285f4
lms.platform.logo=

# ── Inscription en ligne ──
lms.registration.enabled=true
# Rôles autorisés à l'inscription (ETUDIANT, FORMATEUR)
lms.registration.roles=ETUDIANT,FORMATEUR,GED

# ── OAuth2 — Google ──
lms.oauth.google.enabled=true
lms.oauth.google.client-id=
lms.oauth.google.client-secret=
# Callback: https://votre-domaine/api/auth/oauth/google/callback

# ── OAuth2 — Microsoft (Office 365 / Live) ──
lms.oauth.microsoft.enabled=true
lms.oauth.microsoft.client-id=
lms.oauth.microsoft.client-secret=
lms.oauth.microsoft.tenant=common
# Callback: https://votre-domaine/api/auth/oauth/microsoft/callback

# ── Reverse Proxy ──
# Si l'appli est derrière un proxy (Apache/Nginx) qui mappe / vers /lms/,
# définir le context path vu par le navigateur.
# Vide = utilise le context path Tomcat réel (/lms)
# /   = l'appli est exposée à la racine du proxy
lms.proxy.context=/

# ── Entreprise (page d'accueil publique) ──
lms.company.description=Plateforme de formation professionnelle en ligne.
lms.company.mission=Democratiser l'acces a la formation technique de qualite.
lms.company.contact=

# ── Intelligence Artificielle (Anthropic Claude) ──
# Clé API Anthropic (configurable aussi dans Admin > Paramètres)
lms.ai.api-key=
# Modèle par défaut
lms.ai.model=claude-sonnet-4-20250514
