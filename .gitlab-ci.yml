# Pipeline LMS Platform : GitLab CI + GitOps (Flux) sur le cluster kubeadm
# develop : test -> WAR -> image -> mise a jour du tag DEV dans le depot GitOps
# main    : test -> WAR -> image -> STAGING (automatique) -> PROD (bouton manuel)
#
# La pipeline ne touche JAMAIS au cluster : elle publie l'image dans Artifact Registry,
# puis modifie le tag dans k8s/overlays/<env>/kustomization.yaml du depot aljw/iaas-gitops.
# Flux (dans le cluster) detecte le changement et deploie (delai : 5 minutes au plus).
#
# Authentification vers Google Cloud SANS CLE : Workload Identity Federation.
# Le job presente un jeton signe par GitLab (id_tokens), valable quelques minutes ;
# Google le change contre un acces temporaire au compte aljw-ci-push, qui peut
# seulement ecrire dans le depot d'images aljw-docker. Cela ne marche que pour le projet
# aljw/lms-platform et seulement sur les branches PROTEGEES (main et develop).
#
# Variable CI/CD a creer dans le projet (Settings > CI/CD > Variables) :
#   GITOPS_TOKEN  Masked + Protected : jeton de projet de iaas-gitops (write_repository, Developer)

stages:
  - test
  - build
  - image
  - deploy

# Un pipeline par branche, et un par demande de fusion (Merge Request)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  IMAGE_NAME: europe-west1-docker.pkg.dev/formation-equipe1/aljw-docker/lms
  GITOPS_HOST: git.aljw-cluster-iaas.kn8x.net
  GITOPS_REPO: aljw/iaas-gitops
  # Identifiants Google (publics, aucun secret) : voir la federation aljw-gitlab
  GCP_WIF_PROVIDER: projects/950051339107/locations/global/workloadIdentityPools/aljw-gitlab/providers/gitlab
  GCP_PUSH_SA: aljw-ci-push@formation-equipe1.iam.gserviceaccount.com

# Cache Maven : evite de retelecharger les dependances a chaque job
default:
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository

# Job 1 : compilation et tests unitaires (Java 17, comme le pom.xml)
maven-test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS test

# Job 2 : construction du WAR, conserve comme artefact
maven-package:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - target/lms.war
    expire_in: 1 week

# Job 3 : obtenir un acces temporaire a Artifact Registry, sans cle.
# Le resultat (un fichier d'authentification valable environ 1 heure) est transmis
# au job suivant et supprime au bout de 30 minutes.
gar-auth:
  stage: build
  image: google/cloud-sdk:500.0.0-alpine
  cache: []
  id_tokens:
    GCP_ID_TOKEN:
      aud: aljw-gar
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
  script:
    - printf '%s' "$GCP_ID_TOKEN" > "$CI_PROJECT_DIR/.oidc_token"
    - >
      gcloud iam workload-identity-pools create-cred-config "$GCP_WIF_PROVIDER"
      --service-account="$GCP_PUSH_SA"
      --credential-source-file="$CI_PROJECT_DIR/.oidc_token"
      --credential-source-type=text
      --output-file="$CI_PROJECT_DIR/.wif.json"
    - gcloud auth login --cred-file="$CI_PROJECT_DIR/.wif.json" --quiet
    - mkdir -p docker-config
    - AUTH=$(printf 'oauth2accesstoken:%s' "$(gcloud auth print-access-token)" | base64 | tr -d '\n')
    - printf '{"auths":{"europe-west1-docker.pkg.dev":{"auth":"%s"}}}' "$AUTH" > docker-config/config.json
    - rm -f "$CI_PROJECT_DIR/.oidc_token" "$CI_PROJECT_DIR/.wif.json"
  artifacts:
    paths:
      - docker-config/config.json
    expire_in: 30 minutes

# Job 4 : construction et publication de l'image avec Kaniko (pas de Docker dans Docker).
docker-image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["maven-package", "gar-auth"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
  script:
    - mkdir -p /kaniko/.docker
    - cp "$CI_PROJECT_DIR/docker-config/config.json" /kaniko/.docker/config.json
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --destination "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"

# Deploiement GitOps : on change le tag de l'image dans l'overlay de l'environnement,
# puis on pousse dans le depot GitOps. Flux fait le reste.
.deploy-gitops:
  stage: deploy
  image: alpine:3.20
  resource_group: gitops-push
  before_script:
    - apk add --no-cache git
    - git config --global user.name "gitlab-ci"
    - git config --global user.email "gitlab-ci@aljw.invalid"
  script:
    - |
      git clone --depth 1 --branch main "https://oauth2:${GITOPS_TOKEN}@${GITOPS_HOST}/${GITOPS_REPO}.git" gitops
      cd gitops
      FILE="k8s/overlays/${DEPLOY_ENV}/kustomization.yaml"
      sed -i -E "s|^([[:space:]]*newTag:).*|\1 ${CI_COMMIT_SHORT_SHA}|" "$FILE"
      if git diff --quiet; then
        echo "Le tag ${CI_COMMIT_SHORT_SHA} est deja en place pour ${DEPLOY_ENV} : rien a faire."
        exit 0
      fi
      git --no-pager diff -- "$FILE"
      git commit -am "deploy(${DEPLOY_ENV}): lms ${CI_COMMIT_SHORT_SHA}"
      git push origin HEAD:main
      echo "Tag pousse. Flux deploiera ${DEPLOY_ENV} au prochain cycle (5 minutes au plus)."

# DEV : automatique a chaque push sur develop
deploy-dev:
  extends: .deploy-gitops
  needs: ["docker-image"]
  variables:
    DEPLOY_ENV: dev
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# STAGING : automatique a chaque fusion sur main (repetition generale de PROD)
deploy-staging:
  extends: .deploy-gitops
  needs: ["docker-image"]
  variables:
    DEPLOY_ENV: staging
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# PROD : meme image que STAGING, mais apres un clic manuel
deploy-prod:
  extends: .deploy-gitops
  needs: ["deploy-staging"]
  variables:
    DEPLOY_ENV: prod
  environment:
    name: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
