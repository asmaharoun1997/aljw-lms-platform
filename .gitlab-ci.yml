stages:
  - test
  - build

variables:
  # Utilisation du registre de conteneurs intégré à GitLab
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# Job 1 : Compilation et Tests Unitaires Java / Maven
maven-test:
  stage: test
  image: maven:3.8.6-eclipse-temurin-17
  script:
    - echo "=== Lancement des tests unitaires ==="
    - mvn test

# Job 2 : Construction et Publication de l'image Docker
docker-build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "=== Connexion au Container Registry GitLab ==="
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "=== Build de l'image Docker ==="
    - docker build -t $IMAGE_TAG .
    - echo "=== Push de l'image sur le Registry ==="
    - docker push $IMAGE_TAG