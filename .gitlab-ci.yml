# Pipeline LMS Platform : GitLab CI dans aljw-cluster
# develop : test -> WAR -> image -> DEV (automatique)
# main    : test -> WAR -> image -> STAGING (automatique) -> PROD (bouton manuel)
# STAGING et PROD sont des namespaces du cluster, avec la même image que DEV.

stages:
  - test
  - build
  - image
  - deploy

# Un pipeline par branche, et un par demande de fusion (Merge Request)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  IMAGE_NAME: europe-west1-docker.pkg.dev/formation-equipe1/aljw-docker/lms

# Cache Maven : évite de retélécharger les dépendances à chaque job
default:
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository

# Job 1 : compilation et tests unitaires (Java 17, comme le pom.xml)
maven-test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS test

# Job 2 : construction du WAR, conservé comme artefact
maven-package:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - target/lms.war
    expire_in: 1 week

# Job 3 : construction et publication de l'image avec Kaniko
# (pas de Docker dans Docker, donc pas de pod privilégié).
# Authentification vers Artifact Registry par Workload Identity : aucune clé.
docker-image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["maven-package"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
  script:
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --destination "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"

# Déploiement : le Runner met à jour l'image du Deployment "lms" dans le namespace voulu.
# Le job s'exécute avec le compte Kubernetes gitlab-jobs, qui n'a le droit de modifier
# que le Deployment lms de dev, staging et prod (fichier rbac-deploy.yaml).
.deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    # kubectl d'une version proche du cluster (1.36), vérifié par sa somme de contrôle
    - apk add --no-cache curl
    - curl -fsSLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl
    - curl -fsSLo /tmp/kubectl.sha256 https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl.sha256
    - echo "$(cat /tmp/kubectl.sha256)  /usr/local/bin/kubectl" | sha256sum -c -
    - chmod +x /usr/local/bin/kubectl
  script:
    - kubectl -n "$DEPLOY_NS" set image deployment/lms lms="$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - kubectl -n "$DEPLOY_NS" rollout status deployment/lms --timeout=300s

# DEV : automatique à chaque push sur develop
deploy-dev:
  extends: .deploy
  needs: ["docker-image"]
  variables:
    DEPLOY_NS: dev
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# STAGING : automatique à chaque fusion sur main (répétition générale de PROD)
deploy-staging:
  extends: .deploy
  needs: ["docker-image"]
  variables:
    DEPLOY_NS: staging
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# PROD : même image que STAGING, mais après un clic manuel
deploy-prod:
  extends: .deploy
  needs: ["deploy-staging"]
  variables:
    DEPLOY_NS: prod
  environment:
    name: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
